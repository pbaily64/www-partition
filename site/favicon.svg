<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle de fond -->
  <circle cx="32" cy="32" r="32" fill="url(#grad1)"/>
  
  <!-- Note de musique (croche) -->
  <g fill="white">
    <!-- Tige de la note -->
    <rect x="38" y="12" width="3" height="28" rx="1.5"/>
    
    <!-- Tête de la note (ellipse inclinée) -->
    <ellipse cx="33" cy="42" rx="7" ry="5" transform="rotate(-20 33 42)"/>
    
    <!-- Crochet de la croche -->
    <path d="M 41 12 Q 48 14 50 20 Q 51 24 48 26 Q 46 27 44 25 Q 43 23 44 20 Q 45 17 43 15 L 41 13 Z"/>
  </g>
</svg>
